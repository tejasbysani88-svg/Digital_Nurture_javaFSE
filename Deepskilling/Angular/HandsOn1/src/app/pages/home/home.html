<div class="home-container">
  <div class="hero-section">
    <h1>{{ portalName }}</h1>
    <p class="subtitle">Manage courses, enrollment, and profile information seamlessly.</p>
    
    <div class="enrollment-action">
      <button [disabled]="!isPortalActive" (click)="onEnrollClick()" class="btn btn--primary">
        Enroll Now
      </button>
      <p *ngIf="message" class="enroll-message">{{ message }}</p>
    </div>
  </div>

  <div class="search-section">
    <h3>Search Portal</h3>
    <input [(ngModel)]="searchTerm" class="search-input" placeholder="Type to search courses..." />
    <p class="search-live">Searching for: <strong>{{ searchTerm }}</strong></p>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <span class="stat-val">{{ availableCount }}</span>
      <span class="stat-lbl">Courses Available</span>
    </div>
    <div class="stat-card">
      <span class="stat-val">{{ enrolledCount }}</span>
      <span class="stat-lbl">Enrolled Courses</span>
    </div>
    <div class="stat-card">
      <span class="stat-val">3.8</span>
      <span class="stat-lbl">Current GPA</span>
    </div>
  </div>

  <div class="nav-links">
    <a routerLink="/courses" class="nav-btn">View Course Catalog</a>
    <a routerLink="/profile" class="nav-btn">Student Profile</a>
  </div>
</div>
